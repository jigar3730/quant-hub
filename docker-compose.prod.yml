# Hardened prod: existing data root, loopback-only ports, resource caps, no bind-mounted src.
services:
  postgres:
    container_name: quant-hub-db
    restart: always
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c shared_buffers=1GB
      -c work_mem=32MB
      -c maintenance_work_mem=256MB
      -c effective_cache_size=3GB
    volumes:
      - /mnt/fast/quant-data/postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    mem_limit: 3g
    cpus: 2.0

  quant-hub:
    container_name: quant-hub
    env_file:
      - .env.prod
    environment:
      APP_ENV: prod
      LOG_LEVEL: WARNING
    volumes:
      - /mnt/fast/quant-data/data:/app/data
      - /mnt/fast/quant-data/logs:/app/logs
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-5002}:5000"
    restart: always
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 2.0
