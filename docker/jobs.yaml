# Reference schedule — authoritative source is docker/crontab (installed into the container).
# Last synced: 2026-08-31 (most_actives + large_cap_growth only)

jobs:
  - name: launchpad-most-actives-daily
    cron: "10 17 * * 1-5"
    command: quant-launchpad-daily --universe most_actives --no-email
    strategy: launchpad
    universe: most_actives
    email: false
    status: active

  - name: launchpad-large-cap-growth-daily
    cron: "15 17 * * 1-5"
    command: quant-launchpad-daily --universe large_cap_growth --no-email
    strategy: launchpad
    universe: large_cap_growth
    email: false
    status: active

  - name: digest-daily
    cron: "35 17 * * 1-5"
    command: quant-digest daily
    email: true
    status: active

  - name: launchpad-coverage-weekly
    cron: "30 1 * * 6"
    command: quant-launchpad-all --universes most_actives large_cap_growth --cache --report both
    strategy: launchpad
    email: false
    status: active

  - name: lynch-coverage-weekly
    cron: "0 5 * * 6"
    command: quant-lynch-all --universes most_actives large_cap_growth --no-email
    strategy: lynch
    email: false
    status: active

  - name: ml-label-launchpad-most-actives
    cron: "0 6 * * 6"
    command: "quant-ml label --strategy launchpad --universe most_actives --since $(date -d '90 days ago' +%F)"
    strategy: launchpad
    status: active

  - name: ml-label-launchpad-large-cap-growth
    cron: "10 6 * * 6"
    command: "quant-ml label --strategy launchpad --universe large_cap_growth --since $(date -d '90 days ago' +%F)"
    strategy: launchpad
    status: active

  - name: analytics-weekly
    cron: "50 7 * * 6"
    command: quant-analytics weekly
    status: active

  - name: digest-weekly
    cron: "0 8 * * 6"
    command: quant-digest weekly
    email: true
    status: active
